name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check bamboozled tools tests bot.py
      - run: python -m pytest --timeout=120 -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm test
        working-directory: web
      - run: npm run build && npm run size
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End to end, accessibility and visual-behaviour checks (real server, mock Discord)
        run: npm run test:e2e && npm run test:a11y && npm run test:visual
        working-directory: web
        env: { CI: 'true', PYTHON: python }
      - name: Lighthouse budgets
        run: npm run lighthouse
        working-directory: web
        env: { PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: web/test-results }
