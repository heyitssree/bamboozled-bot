[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: calls a live external service (OpenTDB); deselected by default, run with -m network",
]
asyncio_default_fixture_loop_scope = "function"
